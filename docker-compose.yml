# PostgreSQL only. Django and Next.js run on the host (see README).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vezapp_planner}
      POSTGRES_USER: ${POSTGRES_USER:-vezapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vezapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vezapp} -d ${POSTGRES_DB:-vezapp_planner}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vezapp_pgdata:
